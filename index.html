<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Clock</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="clock-container">
        <div class="time-box">
            <div class="day-box">
                <span id="day_span"></span>
            </div>
            
            <div class="digits">
                <span id="hrs_span">00</span>
                <span class="colon">:</span>
                <span id="mins_span">00</span>
                <span class="colon">:</span><span id="secs_span">00</span>
            </div>

            <div class="ampm-box">
                <span id="ampm_span">AM</span>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
